name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 pip-audit
      - name: Smoke benchmark and acceptance
        run: |
          python scripts/benchmark_cli.py eval/smoke --out logs/metrics.json
          python scripts/check_acceptance.py --metrics logs/metrics.json --gates config/acceptance.yaml
      - name: Lint (flake8)
        run: flake8 . --max-line-length=120 --extend-exclude logs,graphs,.conda
      - name: Format check (black)
        run: black --check .
      - name: Dependency audit
        run: pip-audit -r requirements.txt || true
